<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Habits</title>
<meta name="description" content="Your habits, synced between your phone and ATOM.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main id="home" class="screen">
    <header class="topbar">
      <button class="round" id="btn-settings" aria-label="Settings" data-ui="settings"></button>
      <div class="sync-dot" id="sync-dot" title=""></div>
      <div class="spacer"></div>
      <button class="round" id="btn-stats" aria-label="Statistics" data-ui="chart-line"></button>
      <button class="round accent" id="btn-add" aria-label="New habit" data-ui="plus"></button>
    </header>
    <section id="list"></section>
    <nav class="views" id="views" aria-label="View">
      <button data-view="cards" aria-label="Cards" data-ui="layout-grid"></button>
      <button data-view="checklist" aria-label="Checklist" data-ui="list-check"></button>
      <button data-view="grid" aria-label="Grid" data-ui="list-details"></button>
    </nav>
  </main>

  <section id="detail" class="screen page" aria-hidden="true"></section>
</div>

<div id="scrim"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div id="sheet2" class="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
